<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trash Titans — Green Bin Guide</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --soil: #1c1f16;
    --leaf: #4a7c2f;
    --leaf-bright: #7cb342;
    --paper: #f2efe4;
    --paper-dim: #c9c4b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--soil);
    color: var(--paper);
    font-family: 'Courier New', monospace;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 2px solid var(--leaf);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--leaf-bright);
  }

  h1 {
    font-family: Georgia, serif;
    font-size: 28px;
    margin: 8px 0;
  }

  header p {
    color: var(--paper-dim);
    font-size: 14px;
    max-width: 60ch;
  }

  .search-wrap {
    padding: 16px 20px;
    position: sticky;
    top: 0;
    background: var(--soil);
    border-bottom: 1px solid #333;
  }

  #search {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background: #262a1d;
    border: 1px solid var(--leaf);
    border-radius: 4px;
    color: var(--paper);
  }

  #list {
    list-style: none;
    margin: 0;
    padding: 8px 20px 60px;
  }

  .item {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #2e321f;
  }

  .name {
    font-family: Georgia, serif;
  }

  .tag {
    font-size: 10px;
    background: var(--leaf);
    color: var(--soil);
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: bold;
  }

  .status {
    padding: 8px 20px;
    font-size: 12px;
    color: var(--paper-dim);
  }

  .error, .loading {
    padding: 40px 20px;
    text-align: center;
    color: var(--paper-dim);
  }
</style>
</head>

<body>

<header>
  <p class="eyebrow">Trash Titans · Scan & Sort</p>
  <h1>What goes in the Green Bin?</h1>
  <p>Search compost items from Supabase database.</p>
</header>

<div class="search-wrap">
  <input id="search" placeholder="Search e.g. banana peel, coffee grounds..." />
</div>

<div class="status" id="status"></div>
<ul id="list"></ul>

<script>
window.addEventListener("load", async () => {

  // Wait until Supabase library exists
  if (!window.supabase) {
    console.error("Supabase library not loaded");
    return;
  }

  const SUPABASE_URL = "https://piocpwebihpspsmahrao.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpb2Nwd2ViaWhwc3BzbWFocmFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxODA4MTMsImV4cCI6MjA5ODc1NjgxM30.zf30btX2huPrjzLlfhurvE9Irv-2DP3kAaZfE3qSAIc"; // <-- keep anon key ONLY

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const searchEl = document.getElementById("search");

  let allItems = [];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
  }

  function render(items) {
    listEl.innerHTML = "";

    if (!items.length) {
      listEl.innerHTML = `<li class="loading">No items found.</li>`;
      return;
    }

    const frag = document.createDocumentFragment();

    for (const it of items) {
      const li = document.createElement("li");
      li.className = "item";

      li.innerHTML = `
        <span class="name">${escapeHtml(it.item)}</span>
        <span class="tag">Green Bin</span>
      `;

      frag.appendChild(li);
    }

    listEl.appendChild(frag);
  }

  function filter(q) {
    q = q.toLowerCase();

    const filtered = allItems.filter(x =>
      x.item.toLowerCase().includes(q)
    );

    render(filtered);
    statusEl.textContent = `${filtered.length} matches`;
  }

  async function load() {
    try {
      statusEl.textContent = "Loading Green Bin items...";

      const { data, error } = await supabase
        .from("green_bin_items")
        .select("*")
        .order("item");

      if (error) throw error;

      allItems = data || [];

      statusEl.textContent = `${allItems.length} Green Bin items loaded`;

      render(allItems);

    } catch (err) {
      console.error(err);
      statusEl.textContent = "";
      listEl.innerHTML =
        `<li class="error">Failed to load Supabase data.</li>`;
    }
  }

  searchEl.addEventListener("input", e => filter(e.target.value));

  load();

});
</script>

</body>
</html>
