<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What goes in the Green Bin? — Trash Titans</title>

<style>
  :root {
    --soil: #1c1f16;
    --leaf: #4a7c2f;
    --leaf-bright: #7cb342;
    --paper: #f2efe4;
    --paper-dim: #c9c4b0;
    --rot: #8a5a3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--soil);
    color: var(--paper);
    font-family: 'Courier New', ui-monospace, monospace;
    min-height: 100vh;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 2px solid var(--leaf);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--leaf-bright);
    margin: 0 0 6px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    margin: 0 0 8px;
  }

  header p {
    margin: 0;
    color: var(--paper-dim);
    font-size: 14px;
    max-width: 60ch;
  }

  .search-wrap {
    padding: 16px 20px;
    position: sticky;
    top: 0;
    background: var(--soil);
    z-index: 10;
    border-bottom: 1px solid #333;
  }

  #search {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background: #262a1d;
    border: 1px solid var(--leaf);
    border-radius: 4px;
    color: var(--paper);
  }

  #list {
    list-style: none;
    margin: 0;
    padding: 8px 20px 60px;
  }

  .item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #2e321f;
  }

  .name {
    font-family: Georgia, serif;
  }

  .tag {
    font-size: 10px;
    background: var(--leaf);
    color: var(--soil);
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: bold;
  }

  .status {
    padding: 8px 20px;
    font-size: 12px;
    color: var(--paper-dim);
  }

  .error, .loading {
    padding: 40px 20px;
    text-align: center;
    color: var(--paper-dim);
  }
</style>
</head>

<body>

<header>
  <p class="eyebrow">Trash Titans · Scan & Sort</p>
  <h1>What goes in the Green Bin?</h1>
  <p>Search compost items from the City of Toronto Waste Wizard dataset.</p>
</header>

<div class="search-wrap">
  <input id="search" placeholder="Search e.g. banana peel, coffee grounds..." />
</div>

<div class="status" id="status"></div>
<ul id="list"></ul>

<script>
(function () {

  const PACKAGE_URL =
    "https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=waste-wizard-lookup-table";

  const GREEN_BIN_MARKERS = ["green bin", "organics", "compost"];

  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const searchEl = document.getElementById("search");

  let allItems = [];

  function render(items) {
    listEl.innerHTML = "";

    if (items.length === 0) {
      listEl.innerHTML = `<li class="loading">No items found.</li>`;
      return;
    }

    const frag = document.createDocumentFragment();

    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item";

      li.innerHTML = `
        <span class="name">${escapeHtml(it.item)}</span>
        <span class="tag">Green Bin</span>
      `;

      frag.appendChild(li);
    });

    listEl.appendChild(frag);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
  }

  function filter(q) {
    q = q.toLowerCase();
    const filtered = allItems.filter(x =>
      x.item.toLowerCase().includes(q)
    );
    render(filtered);
    statusEl.textContent = `${filtered.length} matches`;
  }

  async function load() {
    try {
      statusEl.textContent = "Loading data...";

      const pkg = await fetch(PACKAGE_URL);
      const pkgJson = await pkg.json();

      const resource = pkgJson.result.resources.find(r => r.format === "JSON");

      const meta = await fetch(
        "https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/resource_show?id=" +
        resource.id
      );

      const metaJson = await meta.json();

      const dataRes = await fetch(metaJson.result.url);
      const raw = await dataRes.json();

      const records = Array.isArray(raw) ? raw : (raw.data || raw.items || []);

      allItems = records
        .map(r => {
          const text = Object.values(r).join(" ").toLowerCase();
          const name = Object.values(r)[0];
          return { item: name, raw: text };
        })
        .filter(x =>
          GREEN_BIN_MARKERS.some(m => x.raw.includes(m))
        );

      statusEl.textContent = `${allItems.length} Green Bin items loaded`;
      render(allItems);

    } catch (e) {
      console.error(e);
      statusEl.textContent = "";
      listEl.innerHTML = `<li class="error">Failed to load data. Try again later.</li>`;
    }
  }

  searchEl.addEventListener("input", e => filter(e.target.value));

  load();

})();
</script>

</body>
</html>
